<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Étude notariale Thomas Lévy">
  <!--
    Favicon provisoire. Le site n'en avait aucun : l'onglet, le favori et la
    ligne de résultat mobile affichaient l'icône par défaut du navigateur.
    Composition tirée des seuls tokens du §5 — fond night, filet et lettre en
    gold — sans emprunter au panonceau, qui appartient à la profession.
    À remplacer par l'emblème définitif lorsque l'identité sera arrêtée.
  -->
  <rect width="64" height="64" fill="#101C2C"/>
  <rect x="18" y="13" width="28" height="1.5" fill="#A98A4C"/>
  <text x="32" y="46" fill="#A98A4C" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="500" text-anchor="middle">L</text>
</svg>
