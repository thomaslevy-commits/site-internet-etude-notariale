name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Build, types et lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install
      - name: Build
        run: npm run build
      - name: Vérification des types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
