name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Build, types et lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install
      - name: Build
        run: npm run build
      - name: Vérification des types
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  recette:
    name: Accessibilité et performances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install
      - name: Build
        run: npm run build
      - name: Démarrer le serveur
        run: npm run start &
      - name: Attendre le serveur
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Installer Chrome et ChromeDriver synchronisés
        run: npx browser-driver-manager install chrome
      # La version d'axe-core est épinglée : une montée de version silencieuse
      # modifie les règles appliquées et fait varier le résultat d'un jour à
      # l'autre sans qu'aucun code n'ait changé. L'audit est par ailleurs
      # rejoué une fois avant de conclure à l'échec — le rendu de la page peut
      # n'être pas tout à fait stabilisé au premier passage, ce qui a déjà
      # produit de fausses violations « color-contrast » (run 30726637553).
      - name: Audit axe-core
        run: |
          source ~/.browser-driver-manager/.env
          auditer() {
            npx @axe-core/cli@4.12.1 \
              http://localhost:3000 \
              http://localhost:3000/expertises/vefa \
              http://localhost:3000/faq \
              http://localhost:3000/contact \
              --chromedriver-path "$CHROMEDRIVER_TEST_PATH" \
              --exit
          }
          auditer || {
            echo "::warning::Premier passage d'axe-core en échec — second essai avant de conclure."
            auditer
          }
      - name: Lighthouse CI
        run: npx @lhci/cli autorun
